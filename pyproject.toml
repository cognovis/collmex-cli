[project]
name = "collmex-cli"
version = "0.0.0.dev0"
description = "CLI wrapper for Collmex accounting API - LLM-friendly interface"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Malte Sussdorff", email = "malte.sussdorff@cognovis.de" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "drafthorse>=2.4.0",
    "factur-x>=1.12",
    "reportlab>=4.0.0",
]

[project.scripts]
collmex = "collmex_cli.main:app"

[project.urls]
Homepage = "https://github.com/cognovis/collmex-cli"
Repository = "https://github.com/cognovis/collmex-cli"
Issues = "https://github.com/cognovis/collmex-cli/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collmex_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "library/sussdorff-core/skills/business/customer-invoice/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py314"
line-length = 120
